# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket / injection overrides DB facts (ticket_trust)
stale_policy: FM-06            # superseded or not-yet-effective clause (stale_clause)
clause_sum: FM-04              # sum clauses instead of max (sum_parts)
double_deduct: FM-05           # agent deducts prior refund itself, host deducts again (pre_deducted)
sibling_refund: FM-07          # refund written under sibling claims of the same order
denied_ignored: FM-02          # host/approval denied, agent still reports resolved (ignore_denied)
reply_ledger_mismatch: FM-08   # reply states an amount the ledger does not hold (misreport)
cross_principal: FM-09         # acts on / leaks another principal's order (cross_principal)
